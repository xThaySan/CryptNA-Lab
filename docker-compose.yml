x-debug-env: &debug-env
  CRYPTNA_DEBUG: ${CRYPTNA_DEBUG:-0}
  XFRM_MODE: ${XFRM_MODE:-apply} # [dry-run; apply]

x-client: &client-base
  build:
    context: .
    dockerfile: client/Dockerfile
  command: sh -c "/app/natt-listener -port 4500 & sleep infinity"
  cap_add:
    - NET_ADMIN
  environment:
    <<: *debug-env
    CLIENT_ATTESTATION_REQUIRED: ${CLIENT_ATTESTATION_REQUIRED:-${PEP_ATTESTATION_ENABLED:-0}}
  volumes:
    - ./client/config.json:/app/config.json:ro
  
services:
  client:
    <<: *client-base
    container_name: cryptna-client
    networks:
      wan_net:
        ipv4_address: 172.20.0.10
    volumes:
      - ./client/config.json:/app/config.json:ro
      - ./client/identities/client1.json:/app/identity.json:ro

  client2:
    <<: *client-base
    container_name: cryptna-client-2
    networks:
      wan_net:
        ipv4_address: 172.20.0.11
    volumes:
      - ./client/config.json:/app/config.json:ro
      - ./client/identities/client2.json:/app/identity.json:ro

  pdp:
    build:
      context: .
      dockerfile: pdp/Dockerfile
    container_name: cryptna-pdp
    networks:
      wan_net:
        ipv4_address: 172.20.0.20
      pdp_pip_net:
        ipv4_address: 172.21.0.20
      pdp_pep_net:
        ipv4_address: 172.23.0.20
    environment:
      <<: *debug-env
      PIP_URL: http://172.21.0.30:8080
      PEP_CONTROL_URL: http://172.23.0.40:8080
      PEP_WAN_ADDRESS: 172.20.0.40
      PEP_NATT_PORT: 4500

  pip:
    build:
      context: .
      dockerfile: pip/Dockerfile
    container_name: cryptna-pip
    volumes:
      - pip_data:/data
    networks:
      pdp_pip_net:
        ipv4_address: 172.21.0.30
    environment:
      <<: *debug-env

  verifier:
    build:
      context: .
      dockerfile: verifier/Dockerfile
    container_name: cryptna-verifier
    volumes:
      - verifier_data:/data
    networks:
      pdp_pep_net:
        ipv4_address: 172.23.0.50
    environment:
      VERIFIER_ID: cryptna-verifier-v1
      VERIFIER_EXPECTED_MEASUREMENT: cryptna-lab-pep-measurement-v1
      VERIFIER_EXPECTED_POLICY_HASH: cryptna-lab-policy-v1
      VERIFIER_TOKEN_TTL_SECONDS: ${VERIFIER_TOKEN_TTL_SECONDS:-120}
      VERIFIER_ALLOWED_SCOPE: ${VERIFIER_ALLOWED_SCOPE:-svc-http}
      VERIFIER_MAX_SA_LIFETIME_SECONDS: ${VERIFIER_MAX_SA_LIFETIME_SECONDS:-60}
      VERIFIER_ENROLLED_PEPS: /app/enrolled_peps.json
      VERIFIER_REQUIRED_OBSERVER_PROFILE: ${VERIFIER_REQUIRED_OBSERVER_PROFILE:-posthoc}
      VERIFIER_STATE_PATH: /data/state.json

  pep:
    build:
      context: .
      dockerfile: pep/Dockerfile
    container_name: cryptna-pep
    networks:
      wan_net:
        ipv4_address: 172.20.0.40
      pdp_pep_net:
        ipv4_address: 172.23.0.40
      service_net:
        ipv4_address: 172.22.0.40
    cap_add:
      - NET_ADMIN
    volumes:
      - pep_data:/data
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      <<: *debug-env
      PEP_LOCAL_ENDPOINT_IP: 172.20.0.40
      SERVICE_IP: 172.22.0.50
      NATT_PORT: 4500
      XFRM_REQID_BASE: 1000
      SA_LIFETIME_SECONDS: ${SA_LIFETIME_SECONDS:-60}
      SESSION_REAPER_INTERVAL_SECONDS: ${SESSION_REAPER_INTERVAL_SECONDS:-5}
      PEP_STATE_PATH: /data/state.json
      PEP_STATE_PERSISTENCE_ENABLED: ${PEP_STATE_PERSISTENCE_ENABLED:-1}
      PEP_ATTESTATION_KEY: /app/pep_attestation_key.json
      PEP_VERIFIER_PUBLIC_KEY: wOtWIxwBDPM5duRETS3SkWZJOCu70G4AsS/NugQCl9U=
      CLIENT_INNER_IP_START: 10
      PEP_FIREWALL_ENABLED: ${PEP_FIREWALL_ENABLED:-1}
      CLIENT_TUNNEL_CIDR: ${CLIENT_TUNNEL_CIDR:-10.200.0.0/16}
      SERVICE_PORT: 80
      PEP_ATTESTATION_ENABLED: ${PEP_ATTESTATION_ENABLED:-0}
      PEP_ID: cryptna-pep-1
      VERIFIER_URL: http://172.23.0.50:8080
      PEP_MEASUREMENT: cryptna-lab-pep-measurement-v1
      PEP_POLICY_HASH: cryptna-lab-policy-v1
      PEP_ATTESTATION_SCOPE: svc-http
      PEP_CAPACITY_MAX_SA_LIFETIME_SECONDS: ${PEP_CAPACITY_MAX_SA_LIFETIME_SECONDS:-60}
      XFRM_OBSERVER: ${XFRM_OBSERVER:-posthoc}
      PEP_REQUIRED_OBSERVER_PROFILE: ${VERIFIER_REQUIRED_OBSERVER_PROFILE:-posthoc}
      XFRM_EBPF_STRICT: ${XFRM_EBPF_STRICT:-0}
      XFRM_EBPF_LOG_EVENTS: ${XFRM_EBPF_LOG_EVENTS:-0}
      XFRM_EBPF_MIN_APPLY_EVENTS: ${XFRM_EBPF_MIN_APPLY_EVENTS:-2}
      XFRM_EBPF_MIN_DELETE_EVENTS: ${XFRM_EBPF_MIN_DELETE_EVENTS:-2}

  service-http:
    build:
      context: .
      dockerfile: service/Dockerfile
    container_name: cryptna-service-http
    cap_add:
      - NET_ADMIN
    networks:
      service_net:
        ipv4_address: 172.22.0.50

  spa-send:
    build:
      context: .
      dockerfile: tools/spa-send/Dockerfile
    container_name: cryptna-spa-send
    command: sleep infinity
    environment:
      <<: *debug-env
    networks:
      wan_net:
        ipv4_address: 172.20.0.60
    volumes:
      - ./client/config.json:/app/config.json:ro
      - ./client/identities/test.json:/app/identity.json:ro

networks:
  wan_net:
    ipam:
      config:
        - subnet: 172.20.0.0/24
  pdp_pip_net:
    ipam:
      config:
        - subnet: 172.21.0.0/24
  service_net:
    ipam:
      config:
        - subnet: 172.22.0.0/24
  pdp_pep_net:
    ipam:
      config:
        - subnet: 172.23.0.0/24

volumes:
  pip_data:
  verifier_data:
  pep_data:
