x-debug-env: &debug-env
  CRYPTNA_DEBUG: ${CRYPTNA_DEBUG:-0}

services:
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: cryptna-client
    networks:
      control_net:
        ipv4_address: 172.20.0.10
      data_net:
        ipv4_address: 172.21.0.10
    cap_add:
      - NET_ADMIN
    environment:
      <<: *debug-env
      XFRM_MODE: ${XFRM_MODE:-dry-run}
      CLIENT_OUTER_IP: 172.21.0.10

  pdp:
    build:
      context: .
      dockerfile: pdp/Dockerfile
    container_name: cryptna-pdp
    networks:
      control_net:
        ipv4_address: 172.20.0.20
    environment:
      <<: *debug-env

  pip:
    build:
      context: .
      dockerfile: pip/Dockerfile
    container_name: cryptna-pip
    volumes:
      - pip_data:/data
    networks:
      control_net:
        ipv4_address: 172.20.0.30
    environment:
      <<: *debug-env

  pep:
    build:
      context: .
      dockerfile: pep/Dockerfile
    container_name: cryptna-pep
    networks:
      control_net:
        ipv4_address: 172.20.0.40
      data_net:
        ipv4_address: 172.21.0.40
      service_net:
        ipv4_address: 172.22.0.40
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      <<: *debug-env
      XFRM_MODE: ${XFRM_MODE:-dry-run}
      CLIENT_OUTER_IP: 172.21.0.10
      PEP_OUTER_IP: 172.21.0.40
      SERVICE_IP: 172.22.0.50
      NATT_PORT: 4500
      XFRM_REQID_BASE: 1000
      SA_LIFETIME_SECONDS: ${SA_LIFETIME_SECONDS:-60}
      SESSION_REAPER_INTERVAL_SECONDS: ${SESSION_REAPER_INTERVAL_SECONDS:-5}
      CLIENT_INNER_IP_PREFIX: 10.200.0
      CLIENT_INNER_IP_START: 10

  service-http:
    build:
      context: .
      dockerfile: service/Dockerfile
    container_name: cryptna-service-http
    cap_add:
      - NET_ADMIN
    networks:
      service_net:
        ipv4_address: 172.22.0.50
  
  spa-send:
    build:
      context: .
      dockerfile: tools/spa-send/Dockerfile
    container_name: cryptna-spa-send
    command: sleep infinity
    environment:
      <<: *debug-env
    networks:
      control_net:
        ipv4_address: 172.20.0.60

networks:
  control_net:
    ipam:
      config:
        - subnet: 172.20.0.0/24
  data_net:
    ipam:
      config:
        - subnet: 172.21.0.0/24
  service_net:
    ipam:
      config:
        - subnet: 172.22.0.0/24

volumes:
  pip_data:
